<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macros</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macros">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
 <!-- Dodaj ove meta tagove za sprječavanje starog cachea na iOS-u -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
 
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root {
  --bg: #000000;
  --fg: #ffffff;
  --mut: #8e8e93;
  --card: #1c1c1e;
  --card-elevated: #242426;
  --line: rgba(255, 255, 255, 0.08);
  --fill: rgba(255, 255, 255, 0.10);
  --acc: #30d158; /* Apple Activity Neon Green */
  --p: #fa114f;   /* Apple Move Pink/Red */
  --c: #00e5ff;   /* Apple Exercise Cyan */
  --f: #ffd60a;   /* Apple Stand Yellow/Amber */
  --spec: rgba(255, 255, 255, 0.15);
  --edge: rgba(255, 255, 255, 0.06);
  --glass: rgba(28, 28, 30, 0.82);
  --glassb: rgba(44, 44, 46, 0.9);
  --pill: #2c2c2e;
  --sheet: #1c1c1e;
  --glow: rgba(48, 209, 88, 0.12);
  --glow2: rgba(0, 229, 255, 0.1);
  box-sizing: border-box;
  color-scheme: dark;
}

/* Version badge in top right corner */
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: #000000;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  background: #000000;
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
  min-height: 100vh;
  padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 20px) + 36px) 18px 24px;
}
h1 {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.7px;
  margin: 0 0 14px;
  color: #ffffff;
}
.sub {
  color: var(--mut);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-top: 14px;
  margin-bottom: 2px;
}
.sec {
  color: var(--mut);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin: 22px 6px 10px;
}
.card {
  background: var(--card);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 14px;
  border: 0.5px solid var(--line);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  transition: transform 0.15s ease, background 0.2s;
}
.card.list {
  padding: 6px 18px;
}
.hero {
  text-align: center;
}
.ringw {
  position: relative;
  width: 180px;
  height: 180px;
  margin: 4px auto 16px;
}
.ring {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.rt {
  fill: none;
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 14;
}
.rp {
  fill: none;
  stroke-width: 14;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s;
}
.rc {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.big {
  font-size: 46px;
  font-weight: 800;
  letter-spacing: -1.2px;
  line-height: 1;
  color: #ffffff;
}
.big small {
  font-size: 14px;
  font-weight: 600;
  color: var(--mut);
  letter-spacing: 0;
}
.rc .lb {
  font-size: 13px;
  color: var(--mut);
  font-weight: 600;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.eg {
  display: flex;
  justify-content: center;
  gap: 32px;
  color: var(--mut);
  font-size: 14px;
  margin-bottom: 20px;
}
.eg b {
  color: var(--fg);
  font-weight: 700;
}
.macros {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  text-align: left;
  padding-top: 18px;
  border-top: 0.5px solid var(--line);
}
.mc .n {
  font-size: 12px;
  color: var(--mut);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.mc .n i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.mc .v {
  font-size: 20px;
  font-weight: 800;
  margin: 6px 0 3px;
  letter-spacing: -0.4px;
  color: #ffffff;
}
.mc .v small {
  font-size: 12px;
  color: var(--mut);
  font-weight: 600;
}
.bar {
  height: 6px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 3px;
  overflow: hidden;
  margin: 8px 0 0;
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: var(--acc);
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-top: 0.5px solid var(--line);
}
.item:first-child {
  border-top: 0;
}
.item .t {
  flex: 1;
  min-width: 0;
}
.item .t div:first-child {
  font-weight: 600;
  font-size: 16px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #ffffff;
}
.item .t div + div {
  font-size: 13px;
  color: var(--mut);
  margin-top: 3px;
  font-weight: 500;
}
.x {
  background: rgba(255, 255, 255, 0.1);
  border: 0;
  color: var(--mut);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
}
.x:active {
  background: rgba(255, 255, 255, 0.2);
}
.add {
  background: rgba(48, 209, 88, 0.16);
  color: var(--acc);
  border: 0;
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.empty {
  color: var(--mut);
  text-align: center;
  padding: 30px 0;
  font-size: 15px;
}

.today-version {
  text-align: center;
  padding: 32px 0 20px;
  font-size: 12px;
  font-weight: 600;
  color: #636366;
  letter-spacing: 0.5px;
}

/* Floating iOS Topbar & Tabbar */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 4;
  padding-top: env(safe-area-inset-top, 0px);
  height: calc(env(safe-area-inset-top, 0px) + 46px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 12px;
  font-weight: 700;
  font-size: 16px;
  background: rgba(0, 0, 0, 0.85);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--line);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.topbar.on {
  opacity: 1;
}

.tabs {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex;
  padding: 5px;
  border-radius: 999px;
  background: rgba(28, 28, 30, 0.88);
  -webkit-backdrop-filter: blur(30px);
  backdrop-filter: blur(30px);
  border: 0.5px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  z-index: 5;
}
.pill {
  position: absolute;
  top: 5px;
  left: 5px;
  width: 112px;
  height: calc(100% - 10px);
  border-radius: 999px;
  background: #3a3a3c;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
.tabs button {
  position: relative;
  z-index: 1;
  width: 112px;
  background: none;
  border: 0;
  color: var(--mut);
  font-size: 11px;
  font-weight: 600;
  padding: 8px 0 7px;
  border-radius: 999px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  transition: color 0.2s;
}
.tabs button svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}
.tabs button.on {
  color: #ffffff;
}

/* Apple Neon FAB button */
.fab {
  position: fixed;
  right: 20px;
  bottom: calc(88px + env(safe-area-inset-bottom, 0px));
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--acc);
  color: #000000;
  border: 0;
  padding: 0;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px rgba(48, 209, 88, 0.4);
  cursor: pointer;
  z-index: 3;
  transition: transform 0.15s ease;
}
.fab svg {
  display: block;
  width: 26px;
  height: 26px;
  stroke: #000000;
}
.fab:active {
  transform: scale(0.92);
}

/* Bottom Sheet Modal */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 10;
  animation: fade 0.2s ease;
}
.sheet {
  background: var(--sheet);
  border: 0.5px solid rgba(255, 255, 255, 0.14);
  border-radius: 32px 32px 0 0;
  width: 100%;
  max-width: 500px;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  max-height: 88vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
  animation: pop 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
.sheet::before {
  content: "";
  position: absolute;
  top: 9px;
  left: 50%;
  width: 38px;
  height: 5px;
  margin-left: -19px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.25);
}

.seg {
  display: flex;
  background: #2c2c2e;
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 18px;
}
.seg button {
  flex: 1;
  border: 0;
  background: none;
  color: var(--mut);
  padding: 8px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.seg button.on {
  background: #3a3a3c;
  color: #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

label {
  display: block;
  font-size: 13px;
  color: var(--mut);
  font-weight: 600;
  margin: 12px 4px 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
input, textarea, select {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 0.5px solid rgba(255, 255, 255, 0.1);
  background: #2c2c2e !important;
  color: #ffffff !important;
  outline: none;
  font-size: 16px;
  font-family: inherit;
}
input:focus, textarea:focus {
  border-color: var(--acc);
}
.g {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.btn {
  width: 100%;
  background: var(--acc);
  color: #000000;
  border: 0;
  border-radius: 16px;
  padding: 15px;
  font-size: 17px;
  font-weight: 700;
  margin-top: 18px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(48, 209, 88, 0.3);
  transition: transform 0.15s;
}
.btn:active {
  transform: scale(0.97);
}
.btn.g2 {
  background: #2c2c2e;
  color: #ffffff;
  box-shadow: none;
}

/* Calendar & Stats Grid */
.cal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  text-align: center;
  margin-top: 14px;
}
.cal .h {
  color: var(--mut);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 0;
}
.cal button {
  aspect-ratio: 1;
  border: 0;
  border-radius: 50%;
  background: #2c2c2e;
  color: var(--fg);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s;
}
.cal button.no {
  background: none;
  cursor: default;
}
.cal button.td {
  box-shadow: inset 0 0 0 2px var(--acc);
}
.cal button.sel {
  background: var(--acc) !important;
  color: #000000 !important;
  font-weight: 800;
}
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.nav b {
  font-size: 18px;
  font-weight: 700;
}
.nav button {
  background: #2c2c2e;
  border: 0;
  color: var(--fg);
  font-size: 20px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--card);
  border: 0.5px solid var(--line);
  border-radius: 20px;
  padding: 16px;
}
.stat-card .slabel {
  font-size: 11px;
  color: var(--mut);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.stat-card .sval {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.6px;
  line-height: 1;
  color: #ffffff;
}
.stat-card .sval small {
  font-size: 13px;
  font-weight: 600;
  color: var(--mut);
}
.stat-card .starget {
  font-size: 12px;
  color: var(--mut);
  margin-top: 4px;
}
.stat-card .sbar {
  height: 5px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 10px;
}
.stat-card .sbar i {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: var(--acc);
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

.goals-edit {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 4px 6px 14px;
}
.goals-edit span {
  font-size: 13px;
  color: var(--mut);
  font-weight: 600;
}
.goals-edit button {
  background: #2c2c2e;
  border: 0;
  color: #ffffff;
  font-size: 13px;
  font-weight: 600;
  border-radius: 10px;
  padding: 6px 14px;
  cursor: pointer;
}

/* Gym Day Accordion */
.gday {
  background: var(--card);
  border: 0.5px solid var(--line);
  border-radius: 18px;
  margin-bottom: 10px;
  overflow: hidden;
}
.gday .hd {
  display: flex;
  align-items: center;
  gap: 12px;
  background: none;
  border: 0;
  color: var(--fg);
  padding: 16px 18px;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.gday .hd .dn {
  flex: 1;
}
.gday .hd .dn b {
  font-size: 16px;
  display: block;
}
.gday .hd .dn span {
  font-size: 13px;
  color: var(--mut);
}
.gday .hd .chev {
  font-size: 14px;
  color: var(--mut);
  transition: transform 0.2s;
}
.gday.open .hd .chev {
  transform: rotate(180deg);
}
.gday .bd {
  display: none;
  padding: 0 18px 16px;
}
.gday.open .bd {
  display: block;
}
.gex {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-top: 0.5px solid var(--line);
}
.gex:first-child {
  border-top: 0;
}
.gex .t b {
  display: block;
  font-size: 14px;
}
.gex .t span {
  font-size: 12px;
  color: var(--mut);
}
.stp {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stp button {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 0;
  background: #2c2c2e;
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}
.stp .w {
  min-width: 50px;
  text-align: center;
  font-weight: 700;
  font-size: 15px;
}
.stp .w small {
  font-size: 11px;
  color: var(--mut);
}
.grest {
  color: var(--mut);
  font-size: 14px;
  padding: 6px 0;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes pop {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>
</head>

function gkey(name){return name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}
function $(id){return document.getElementById(id)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function num(v){v=parseFloat(String(v).replace(',','.'));return isFinite(v)&&v>0?Math.round(v*10)/10:0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* storage: always write to localStorage immediately (instant), sync to cloud via /api/sync */
async function load(k){
  // Try cloud first so all devices share the same data
  try{
    var r=await fetch('/api/sync?key='+encodeURIComponent(k),{cache:'no-store'});
    if(r.ok){var d=await r.json();if(d!==null){try{localStorage.setItem('mt_'+k,JSON.stringify(d))}catch(e){}return d}}
  }catch(e){}
  // Fall back to local cache if offline
  try{return JSON.parse(localStorage.getItem('mt_'+k))}catch(e){return null}
}
async function save(k,v){
  // Write locally for instant feedback
  try{localStorage.setItem('mt_'+k,JSON.stringify(v))}catch(e){}
  // Sync to cloud in the background
  try{fetch('/api/sync?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)}).catch(function(){});}catch(e){}
}
async function loadMonth(m){var d=await load('m_'+m);S.months[m]=(d&&d.days)||{}}
function dayList(date){var m=S.months[date.slice(0,7)]||{};return m[date]||[]}
async function setDay(date,list){
  var m=date.slice(0,7);if(!S.months[m])await loadMonth(m);
  if(list.length)S.months[m][date]=list;else delete S.months[m][date];
  await save('m_'+m,{days:S.months[m]});
}
function tot(list){return list.reduce(function(a,e){a.c+=e.c;a.p+=e.p;a.cb+=e.cb;a.f+=e.f;return a},{c:0,p:0,cb:0,f:0})}
function r(n){return Math.round(n)}

var bi=0;
function barI(pc,color){var k='b'+(bi++);return '<div class="bar"><i data-k="'+k+'" data-w="'+pc+'" style="width:'+(S.pw[k]||0)+'%;background:'+color+'"></i></div>'}
function bar(label,val,goal,color,unit){
  var pc=Math.min(100,goal?val/goal*100:0);
  return '<div class="row"><b>'+label+'</b><span>'+r(val)+' / '+goal+unit+'</span></div>'+barI(pc,color)+'';
}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
 

function entryHtml(list,date){
  if(!list.length)return '<div class="empty">Nothing logged yet</div>';
  return list.map(function(e,i){return '<div class="item"><div class="t"><div>'+esc(e.n)+'</div><div>'+r(e.c)+' kcal · P '+e.p+' · C '+e.cb+' · F '+e.f+'</div></div><button class="x" onclick="delEntry(\''+date+'\','+i+')">✕</button></div>'}).join('');
}
function getBurned(date){
  var act = S.activity && S.activity[date];
  if(!act) return 0;
  var v = (act.cal != null) ? act.cal : (typeof act === 'number' ? act : 0);
  if(v > 15000) v = Math.round(v / 100);
  return Math.round(v);
}
function toggleBurnedCal(){
  S.includeBurned = !S.includeBurned;
  render();
}
function summary(date){
  var list=dayList(date),t=tot(list),g=S.goals,left=g.c-t.c,C=439.8,over=left<0,pc=Math.min(100,t.c/g.c*100),k='r'+(bi++);
  var st=S.pw[k]!=null?S.pw[k]:C;
  var ringSvg='<svg class="ring" viewBox="0 0 176 176"><circle class="rt" cx="88" cy="88" r="70"/><circle class="rp" data-k="'+k+'" data-o="'+(C*(1-pc/100))+'" cx="88" cy="88" r="70" transform="rotate(-90 88 88)" stroke-dasharray="'+C+'" style="stroke-dashoffset:'+st+';stroke:'+(over?'#ff453a':'var(--acc)')+'"/></svg>';
  function mc(n,v,goal,col){return '<div class="mc"><div class="n"><i style="background:'+col+'"></i>'+n+'</div><div class="v">'+r(v)+'<small> / '+goal+'g</small></div>'+barI(Math.min(100,goal?v/goal*100:0),col)+'</div>'}
  var burned = getBurned(date);
  var burnedGoal = 600; // Apple Fitness standard active kcal target
  var bPc = Math.min(100, burned ? (burned / burnedGoal * 100) : 0);
  var bk = 'rb' + (bi++);
  var bst = S.pw[bk] != null ? S.pw[bk] : C;
  var burnedSvg = '<svg class="ring" viewBox="0 0 176 176"><circle class="rt" cx="88" cy="88" r="70"/><circle class="rp" data-k="'+bk+'" data-o="'+(C*(1-bPc/100))+'" cx="88" cy="88" r="70" transform="rotate(-90 88 88)" stroke-dasharray="'+C+'" style="stroke-dashoffset:'+bst+';stroke:#fa114f"/></svg>';

  var ringsHtml = '<div style="display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 16px">'+
    '<div class="ringw" style="width:130px;height:130px;margin:0">'+ringSvg+'<div class="rc"><div class="big" style="font-size:30px">'+r(Math.abs(left))+'</div><div class="lb" style="font-size:10px">kcal '+(over?'over':'left')+'</div></div></div>'+
    '<div class="ringw" style="width:130px;height:130px;margin:0">'+burnedSvg+'<div class="rc"><div class="big" style="font-size:30px;color:#fa114f">'+r(burned)+'</div><div class="lb" style="font-size:10px;color:#fa114f">kcal spent</div></div></div>'+
  '</div>';

  var netCalories = r(t.c - burned);
  return '<div class="card hero">'+ringsHtml+
    '<div class="eg" style="gap:20px;font-size:12px;margin-bottom:14px"><span>Eaten <b>'+r(t.c)+'</b></span><span>Burned <b style="color:#fa114f">'+r(burned)+'</b></span><span>Net <b style="color:'+(netCalories<=g.c?'var(--acc)':'#ff453a')+'">'+netCalories+'</b></span><span>Goal <b>'+g.c+'</b></span></div>'+
    '<div class="macros">'+mc('Protein',t.p,g.p,'var(--p)')+mc('Carbs',t.cb,g.cb,'var(--c)')+mc('Fat',t.f,g.f,'var(--f)')+'</div></div>'+

    '<div class="sec">Meals</div><div class="card list">'+entryHtml(list,date)+'</div>';
}

      else b+=day.ex.map(function(e,ei){

        return '<div class="gex"><div class="t"><b>'+e[0]+'</b><span>'+e[1]+'</span></div><div class="stp">'+stp+'</div></div>';

  }else{
    var y=+S.cal.slice(0,4),mo=+S.cal.slice(5,7),first=new Date(y,mo-1,1),dim=new Date(y,mo,0).getDate();

    ['M','T','W','T','F','S','S'].forEach(function(d){h+='<div class="h">'+d+'</div>'});
    for(var i=0;i<off;i++)h+='<button class="no" disabled></button>';
    for(var d=1;d<=dim;d++){
      var ds=S.cal+'-'+(d<10?'0':'')+d,has=mData[ds]&&mData[ds].length,st='';
      if(has){var c=tot(mData[ds]).c;
      if(S.includeBurned){ c = Math.max(0, c - getBurned(ds)); }
      var q=Math.min(1,c/S.goals.c);st=' style="background:color-mix(in srgb,var(--acc) '+Math.round(22+50*q)+'%,transparent)"'}
      h+='<button class="'+(ds===td?'td ':'')+(ds===S.view?'sel':'')+'"'+st+' onclick="pickDay(\''+ds+'\')">'+d+'</button>';
    }
    h+='</div></div>';
    h+=calorieChartHtml();
    h+=statsHtml();
    h+='<div class="sec" style="margin-top:6px">'+fmtDate(S.view)+'</div>'+summary(S.view);
  }
  $('app').innerHTML=h;syncTabs();
  void $('app').offsetWidth;

  $('tbt').textContent=S.tab==='today'?'Today':S.tab==='cal'?'Calendar':'Gym';
}
function toggleDay(di){S.gymOpen[di]=!S.gymOpen[di];render()}
async function adjW(k,def,delta){
  var cur=S.gym[k]!=null?S.gym[k]:def;
  S.gym[k]=Math.max(0,Math.round((cur+delta)*2)/2);
  await save('gym',{w:S.gym});render();
}
function syncTabs(){$('tb-today').className=S.tab==='today'?'on':'';$('tb-cal').className=S.tab==='cal'?'on':'';$('tb-gym').className=S.tab==='gym'?'on':'';$('pill').style.transform=S.tab==='today'?'none':S.tab==='cal'?'translateX(112px)':'translateX(224px)'}
async function setTab(t){if(t===S.tab)return;S.tab=t;syncTabs();if(t==='cal'){S.view=today();S.cal=today().slice(0,7);await loadMonth(S.cal)}render();var a=$('app');a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade')}
async function moveMonth(n){var y=+S.cal.slice(0,4),m=+S.cal.slice(5,7)-1+n;var d=new Date(y,m,1);S.cal=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);await loadMonth(S.cal);render()}
function pickDay(d){S.view=d;render()}
async function delEntry(date,i){var l=dayList(date).slice();l.splice(i,1);await setDay(date,l);render()}

/* add sheet */

function closeSheet(){S.sheet=null;var o=document.querySelector('.ov');if(o){o.classList.add('out');setTimeout(function(){if(!S.sheet)$('modal').innerHTML=''},270)}}
function setMode(m){S.sheet.mode=m;drawSheet();if(m==='scan'&&S.sample){var had=!!(S.lim&&S.lim.images);S.sample.limits().then(function(l){S.lim=l;if(!!(l&&l.images)!==had)redrawScan()}).catch(function(){})}}
function qa(x){return esc(String(x)).replace(/"/g,'&quot;')}
function formHtml(saveOnly){
  var v=S.pre||{n:'',c:'',p:'',cb:'',f:''};S.pre=null;
  return '<label>Name</label><input type="text" id="fn" placeholder="e.g. Chicken and rice" autocomplete="off" value="'+qa(v.n)+'">'+

  '<div class="g"><div><label>Protein (g)</label><input type="number" inputmode="decimal" id="fp" value="'+v.p+'"></div><div><label>Carbs (g)</label><input type="number" inputmode="decimal" id="fb" value="'+v.cb+'"></div></div>'+
  '<label>Fat (g)</label><input type="number" inputmode="decimal" id="ff" value="'+v.f+'">'+

}
function drawSheet(){
  var m=S.sheet.mode,h='<div class="seg">'+
   '<button class="'+(m==='quick'?'on':'')+'" onclick="setMode(\'quick\')">Quick add</button>'+
   '<button class="'+(m==='scan'?'on':'')+'" onclick="setMode(\'scan\')">Scan</button>'+
   '<button class="'+(m==='meals'||m==='new'?'on':'')+'" onclick="setMode(\'meals\')">My meals</button></div>';
  if(m==='quick')h+=formHtml(false);
  else if(m==='scan')h+=scanHtml();
  else if(m==='new')h+=formHtml(true)+'<button class="btn g2" onclick="setMode(\'meals\')">Back</button>';
  else{
    h+=S.meals.length?S.meals.map(function(e,i){return '<div class="item"><div class="t"><div>'+esc(e.n)+'</div><div>'+r(e.c)+' kcal · P '+e.p+' · C '+e.cb+' · F '+e.f+'</div></div><button class="add" onclick="useMeal('+i+')">Add</button><button class="x" onclick="delMeal('+i+')">✕</button></div>'}).join(''):'<div class="empty">No saved meals yet</div>';
    h+='<button class="btn" onclick="setMode(\'new\')">+ Create new meal</button>';
  }
  var o=document.querySelector('.ov'),sh=$('sh');
  if(o&&!o.classList.contains('out')&&sh){sh.innerHTML=h;sh.classList.remove('fx');void sh.offsetWidth;return}
  $('modal').innerHTML='<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sh">'+h+'</div></div>';
}
function readForm(){
  var n=$('fn').value.trim(),c=num($('fc').value),p=num($('fp').value),b=num($('fb').value),f=num($('ff').value);
  if(!n)n='Quick add';
  if(!c&&!p&&!b&&!f){$('fc').focus();return null}
  return {id:uid(),n:n,c:c,p:p,cb:b,f:f};
}
async function submitForm(saveOnly){
  var e=readForm();if(!e)return;
  if(saveOnly||($('fs')&&$('fs').checked)){S.meals.push(e);await save('meals',{list:S.meals})}
  if(saveOnly){setMode('meals');return}
  var d=today();await setDay(d,dayList(d).concat([Object.assign({},e,{id:uid()})]));closeSheet();render();
}
async function useMeal(i){var e=Object.assign({},S.meals[i],{id:uid()}),d=today();await setDay(d,dayList(d).concat([e]));closeSheet();render()}
async function delMeal(i){S.meals.splice(i,1);await save('meals',{list:S.meals});drawSheet()}


/* scan with Claude */
function scanHtml(){
  var c=S.scan,h='';
  if(!S.sample)return '<div class="empty">Scanning isn\'t available in this view.</div>';
  if(S.lim&&S.lim.images){
    if(c.url)h+='<img class="pv" src="'+c.url+'">';
    h+='<button class="btn g2" style="margin-top:0" onclick="document.getElementById(\'sf\').click()">'+(c.url?'Change photo':'Take or choose a photo')+'</button><input type="file" id="sf" accept="image/*" hidden onchange="pickImg(this)">';
  }else h+='<div class="sub">Photos can\'t be sent from this view, but you can describe the meal in text below and I\'ll still calculate it.</div>';
  h+='<label>Extra info (optional)</label><textarea id="st" rows="3" placeholder="e.g. 200 g cooked rice, fried in 1 tbsp oil" oninput="S.scan.txt=this.value">'+esc(c.txt)+'</textarea>';
  if(c.busy)h+='<button class="btn" disabled style="opacity:.6">Analysing…</button><button class="btn g2" onclick="stopScan()">Stop</button>';
  else h+='<button class="btn" onclick="runScan()">'+(c.res?'Calculate again':'Calculate')+'</button>';
  if(c.err)h+='<div class="foot" style="color:#ff453a;font-size:14px">'+esc(c.err)+'</div>';
  if(c.res){
    var x=c.res;
    h+='<div class="rs fx"><label style="margin-top:0">Name</label><input type="text" id="rn" value="'+qa(x.n)+'">'+
      '<div class="big" style="margin:14px 0 6px">'+r(x.c)+' <small>kcal</small></div>'+
      '<div class="row"><span>Protein <b>'+x.p+'g</b></span><span>Carbs <b>'+x.cb+'g</b></span><span>Fat <b>'+x.f+'g</b></span></div>'+
      (x.note?'<div class="foot" style="text-align:left;font-size:13px">'+esc(x.note)+'</div>':'')+
      '<button class="btn" onclick="useScan(0)">Add to today</button>'+
      '<button class="btn g2" onclick="useScan(1)">Save as meal &amp; add to today</button>'+
      '<button class="btn g2" onclick="useScan(2)">Save as meal only</button>'+
      '<button class="btn g2" onclick="editScan()">Edit values</button></div>';
  }
  return h;
}
function redrawScan(){if(S.sheet&&S.sheet.mode==='scan')drawSheet()}
function shrink(file){return new Promise(function(ok,no){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var m=1280,k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(function(b){b?ok(b):no()},'image/jpeg',.85)};
  im.onerror=function(){URL.revokeObjectURL(u);no()};im.src=u;
})}
async function pickImg(inp){
  var f=inp.files&&inp.files[0];if(!f)return;var c=S.scan;
  try{var b=await shrink(f);if(c.url)URL.revokeObjectURL(c.url);c.blob=b;c.url=URL.createObjectURL(b);c.res=null;c.err=''}
  catch(e){c.err="Couldn't read that image. Try another one."}
  redrawScan();
}
function stopScan(){if(S.scan.ctl)S.scan.ctl.abort()}
async function runScan(){
  var c=S.scan;
  if(!c.blob&&!c.txt.trim()){c.err='Add a photo or some text first.';redrawScan();return}
  c.busy=true;c.err='';c.res=null;c.ctl=new AbortController();redrawScan();
  var q=(c.blob?'The attached image shows food, a meal, or a nutrition label. ':'No image was provided. ')+
    (c.txt.trim()?'Extra info from the user (trust it over guesses): '+c.txt.trim()+'\n':'')+
    'Estimate the TOTAL calories and macros for the whole portion described or shown. If a nutrition label is visible, use it. Reply with only JSON like {"name":"short meal name","kcal":650,"protein":40,"carbs":70,"fat":20,"note":"one short sentence on key assumptions"}. Numbers only, kcal and grams.';
  var o={signal:c.ctl.signal,cache:false};if(c.blob)o.images=c.blob;
  try{
    var d=await S.sample.json(q,o),x={n:String(d.name||'Scanned meal').slice(0,60),c:num(d.kcal),p:num(d.protein),cb:num(d.carbs),f:num(d.fat),note:d.note?String(d.note).slice(0,200):''};
    if(!x.c&&!x.p&&!x.cb&&!x.f)c.err="Couldn't estimate that. Add more detail in the text box.";else c.res=x;
  }catch(e){
    var k=e&&e.code;
    c.err=k==='cancelled'?'':k==='not_granted'?'Permission was declined, so scanning is off for this visit.':k==='rate_limited'?'Too many requests. Wait a moment and try again.':k==='image_rejected'||k==='images_unavailable'?"That image couldn't be used. Try another one.":'Something went wrong. Try again.';
  }
  c.busy=false;c.ctl=null;redrawScan();
}
function scanName(){var e=document.getElementById('rn');return (e&&e.value.trim())||S.scan.res.n}
async function useScan(mode){
  var x=S.scan.res;if(!x)return;var n=scanName(),e={id:uid(),n:n,c:x.c,p:x.p,cb:x.cb,f:x.f};
  if(mode>=1){S.meals.push(e);await save('meals',{list:S.meals})}
  if(mode<=1){var d=today();await setDay(d,dayList(d).concat([Object.assign({},e,{id:uid()})]));closeSheet();resetScan();render()}
  else{resetScan();setMode('meals')}
}
function resetScan(){var c=S.scan;if(c.url)URL.revokeObjectURL(c.url);S.scan={blob:null,url:'',txt:'',busy:false,res:null,err:'',ctl:null}}
function editScan(){var x=S.scan.res;if(!x)return;S.pre={n:scanName(),c:x.c,p:x.p,cb:x.cb,f:x.f};setMode('quick')}

async function loadAll(){
  var m=await load('meals');S.meals=(m&&m.list)||[];
  var g=await load('gym');S.gym=(g&&g.w)||{};
  var gl=await load('goals');if(gl&&gl.c)S.goals=gl;
  var act=await load('steps');S.activity=(act&&act.days)||{};
  // Always ensure the 3 base meals exist (import from image)
  var seed=[{n:'250g (pola) 0% masti jogurta',c:125,p:20.8,cb:10.3,f:0},{n:'Marenda (2 sendvica)',c:525,p:30,cb:60,f:16},{n:'Mahune i kruv',c:780,p:28,cb:85,f:38}];
  var changed=false;
  seed.forEach(function(s){if(!S.meals.some(function(e){return e.n===s.n})){S.meals.push(Object.assign({id:uid()},s));changed=true;}});
  if(changed)await save('meals',{list:S.meals});
// Ensure seed calorie records for 1.10 - 4.10
  var octMonth = '2026-10';
  if (!S.months[octMonth]) await loadMonth(octMonth);
  var mDays = S.months[octMonth] || {};
  var seedEntries = [
    { d: '2026-10-01', c: 2000, n: 'Calorie intake 1.10' },
    { d: '2026-10-02', c: 3000, n: 'Calorie intake 2.10' },
    { d: '2026-10-03', c: 3000, n: 'Calorie intake 3.10' },
    { d: '2026-10-04', c: 3000, n: 'Calorie intake 4.10' }
  ];
  var mChanged = false;
  seedEntries.forEach(function(se){
    if (!mDays[se.d] || !mDays[se.d].length) {
      mDays[se.d] = [{ id: 'seed_' + se.d, n: se.n, c: se.c, p: Math.round(se.c * 0.05), cb: Math.round(se.c * 0.1), f: Math.round(se.c * 0.02) }];
      mChanged = true;
    }
  });
  if (mChanged) {
    S.months[octMonth] = mDays;
    await save('m_' + octMonth, { days: mDays });
  }
  await loadMonth(today().slice(0,7));
  if(S.tab==='cal')await loadMonth(S.cal);
}

/* weekly / monthly stats for calendar tab */
function setChartRange(r){
  S.chartRange = r;
  render();
}

function calorieChartHtml(){
  var range = S.chartRange || 'week'; // 'week' (7 days) or 'month' (30 days)
  var numDays = range === 'week' ? 7 : 30;
  var g = S.goals;
  var td = today(), tDate = new Date(td + 'T12:00:00');
  
  // Build days list with newest date on the LEFT (idx 0 = today, idx 1 = yesterday, ...)
  var days = [];
  var totalC = 0, loggedCount = 0;
  var maxC = Math.max(g.c * 1.3, 3500);

  for (var i = 0; i < numDays; i++) {
    var d = new Date(tDate);
    d.setDate(tDate.getDate() - i);
    var ds = d.toISOString().slice(0, 10);
    var ym = ds.slice(0, 7);
    var mData = S.months[ym] || {};
    var list = mData[ds] || [];
    var cal = list.length ? tot(list).c : 0;
    
    if (cal > 0) {
      totalC += cal;
      loggedCount++;
      if (cal * 1.15 > maxC) maxC = cal * 1.15;
    }
    
    var dayLabel = (d.getMonth() + 1) + '/' + d.getDate();
    var weekday = ['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()];
    days.push({ date: ds, dayNum: d.getDate(), label: range === 'week' ? weekday : dayLabel, cal: cal });
  }

  // Average calculated across the displayed graph
  var avg = loggedCount > 0 ? Math.round(totalC / loggedCount) : 0;
  if (avg * 1.15 > maxC) maxC = avg * 1.15;

  var svgW = range === 'week' ? 340 : Math.max(340, numDays * 16 + 50);
  var svgH = 175;
  var padL = 40, padR = 18, padT = 24, padB = 30;
  var chartW = svgW - padL - padR;
  var chartH = svgH - padT - padB;

  function getY(val) {
    if (maxC <= 0) return padT + chartH;
    return padT + chartH * (1 - Math.min(1, val / maxC));
  }

  var goalY = getY(g.c);
  var avgY = avg > 0 ? getY(avg) : null;

  // Calculate coordinates for points (newest on the left: i = 0 is left)
  var points = [];
  var stepX = numDays > 1 ? chartW / (numDays - 1) : chartW;
  
  days.forEach(function(item, idx){
    var x = padL + idx * stepX;
    var y = getY(item.cal);
    points.push({ x: x, y: y, item: item, idx: idx });
  });

  // Polyline points (pravci)
  var linePointsStr = points.map(function(p){ return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');

  // Dots & interactions
  var dotsSvg = '';
  points.forEach(function(p){
    var isSel = p.item.date === S.view;
    var isToday = p.item.date === today();
    var col = p.item.cal > 0 ? 'var(--acc)' : 'rgba(255,255,255,0.25)';
    var r = isSel ? 6 : (range === 'week' ? 4.5 : 3.5);
    
    dotsSvg += '<g class="cpt" onclick="pickDay(\'' + p.item.date + '\')" style="cursor:pointer">';
    dotsSvg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (r + 7) + '" fill="transparent" />';
    dotsSvg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + r + '" fill="' + (isSel ? '#ffffff' : col) + '" stroke="#000000" stroke-width="2" />';
    
    // Value text for weekly view or when selected
    if ((range === 'week' && p.item.cal > 0) || isSel) {
      dotsSvg += '<text x="' + p.x.toFixed(1) + '" y="' + (p.y - 8).toFixed(1) + '" font-size="9" font-weight="700" fill="' + (isSel ? '#ffffff' : 'var(--acc)') + '" text-anchor="middle">' + Math.round(p.item.cal) + '</text>';
    }
    
    // Bottom X-axis label
    if (range === 'week' || p.idx % 5 === 0 || p.idx === numDays - 1 || isSel) {
      dotsSvg += '<text x="' + p.x.toFixed(1) + '" y="' + (svgH - 8) + '" font-size="9" font-weight="' + (isSel || isToday ? '700' : '500') + '" fill="' + (isSel ? '#ffffff' : isToday ? 'var(--acc)' : '#8e8e93') + '" text-anchor="middle">' + p.item.label + '</text>';
    }
    dotsSvg += '</g>';
  });

  return '<div class="card" style="margin-top:14px;padding:16px 14px 12px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
      '<div>' +
        '<div style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.5px">Calorie Trend (Newest &larr;)</div>' +
        '<div style="font-size:20px;font-weight:800;color:#ffffff;margin-top:2px">' +
          avg + ' <small style="font-size:12px;font-weight:600;color:rgba(255,69,58,0.9)">avg kcal</small>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;background:#2c2c2e;border-radius:10px;padding:2px">' +
        '<button onclick="setChartRange(\'week\')" style="border:0;background:' + (range === 'week' ? '#3a3a3c' : 'none') + ';color:' + (range === 'week' ? '#fff' : 'var(--mut)') + ';font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer">Week</button>' +
        '<button onclick="setChartRange(\'month\')" style="border:0;background:' + (range === 'month' ? '#3a3a3c' : 'none') + ';color:' + (range === 'month' ? '#fff' : 'var(--mut)') + ';font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer">Month</button>' +
      '</div>' +
    '</div>' +
    '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">' +
      '<svg width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '" style="display:block">' +
        '<!-- Zero axis line -->' +
        '<line x1="' + padL + '" y1="' + (padT + chartH) + '" x2="' + (svgW - padR) + '" y2="' + (padT + chartH) + '" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>' +
        '<!-- Green Dashed Line for Daily Limit (Goal) -->' +
        '<line x1="' + padL + '" y1="' + goalY.toFixed(1) + '" x2="' + (svgW - padR) + '" y2="' + goalY.toFixed(1) + '" stroke="var(--acc)" stroke-dasharray="4 4" stroke-width="1.5" opacity="0.8"/>' +
        '<text x="' + (padL - 4) + '" y="' + (goalY + 3).toFixed(1) + '" font-size="9" font-weight="700" fill="var(--acc)" text-anchor="end">' + g.c + '</text>' +
        (avgY !== null ? (
          '<!-- Transparent Red Line for Average -->' +
          '<line x1="' + padL + '" y1="' + avgY.toFixed(1) + '" x2="' + (svgW - padR) + '" y2="' + avgY.toFixed(1) + '" stroke="rgba(255, 69, 58, 0.55)" stroke-width="2"/>' +
          '<text x="' + (svgW - padR) + '" y="' + (avgY - 4).toFixed(1) + '" font-size="9" font-weight="700" fill="rgba(255, 69, 58, 0.9)" text-anchor="end">Avg ' + avg + '</text>'
        ) : '') +
        '<!-- Green Line connecting points (pravci) -->' +
        '<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="' + linePointsStr + '"/>' +
        dotsSvg +
      '</svg>' +
    '</div>' +
  '</div>';
}

function statsHtml(){
  var mData = S.months[S.cal] || {}, g = S.goals;
  var td = today(), tDate = new Date(td + 'T12:00:00');
  
  // 1. Mjesečne kalorije i limit
  var y = +S.cal.slice(0, 4), mo = +S.cal.slice(5, 7);
  var dim = new Date(y, mo, 0).getDate();
  var monthTotal = 0;
  for (var d = 1; d <= dim; d++) {
    var ds = S.cal + '-' + (d < 10 ? '0' : '') + d;
    if (mData[ds]) monthTotal += tot(mData[ds]).c;
  }
  var monthTarget = dim * g.c;

  // 2. Tjedne kalorije (Ponedjeljak – Nedjelja)
  var dow = (tDate.getDay() + 6) % 7; // 0 = Ponedjeljak
  var weekStart = new Date(tDate);
  weekStart.setDate(tDate.getDate() - dow);
  
  var weekTotal = 0;
  for (var wi = 0; wi < 7; wi++) {
    var wd = new Date(weekStart);
    wd.setDate(weekStart.getDate() + wi);
    var wds = wd.toISOString().slice(0, 10);
    var wm = wds.slice(0, 7);
    var wData = (S.months[wm] || {})[wds];
    if (wData) weekTotal += tot(wData).c;
  }
  var weekTarget = 7 * g.c;

  function sc(label, eaten, target, sublabel){
    var pc = Math.min(100, target ? (eaten / target * 100) : 0);
    var diff = target - eaten, over = diff < 0;
    return '<div class="stat-card">' +
      '<div class="slabel">' + label + '</div>' +
      '<div class="sval">' + Math.round(eaten) + '<small> / ' + Math.round(target) + ' kcal</small></div>' +
      '<div class="starget">' + (over ? '<span style="color:#ff453a">' + Math.round(Math.abs(diff)) + ' over</span>' : '<span>' + Math.round(diff) + ' left</span>') + ' · ' + sublabel + '</div>' +
      '<div class="sbar"><i style="width:' + pc + '%"></i></div>' +
    '</div>';
  }

  return '<div class="sec">Statistics</div>' +
    '<div class="stats-grid">' +
      sc('This week', weekTotal, weekTarget, '7-day target') +
      sc('This month', monthTotal, monthTarget, dim + '-day target') +
    '</div>';
}

function blobToData(b){return new Promise(function(ok,no){var fr=new FileReader();fr.onload=function(){ok(fr.result)};fr.onerror=no;fr.readAsDataURL(b)})}
var AISample={
  limits:function(){return Promise.resolve({images:true})},
  json:async function(q,o){
    var body={prompt:q};if(o&&o.images)body.image=await blobToData(o.images);
    var res;
    try{res=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:o&&o.signal})}
    catch(e){var er=new Error('x');er.code=e&&e.name==='AbortError'?'cancelled':'net';throw er}
    var d=await res.json().catch(function(){return {}});
    if(!res.ok){var er2=new Error(d.error||'x');er2.code=res.status===429?'rate_limited':'err';throw er2}
    return d;
  }
};
async function init(){
  render();
  S.sample=AISample;S.lim={images:true};
  await loadAll();
  if(!S.sheet)render();
}

/* Auto-update checker: detektira noviju verziju na Vercelu i osvjezava PWA */
var CURRENT_VERSION = 'v1.10';
async function checkForAppUpdates(){
  try {
    var res = await fetch('/macros.html?_check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    var html = await res.text();
    var match = html.match(/id="versionBadge"[^>]*>([^<]+)<\/div>/);
    if (match && match[1] && match[1].trim() !== CURRENT_VERSION) {
      console.log('New version found: ' + match[1] + '. Updating...');
      window.location.reload();
    }
  } catch(e) {}
}

document.addEventListener('visibilitychange', function(){
  if (!document.hidden) checkForAppUpdates();
});
setInterval(checkForAppUpdates, 60000); // provjerava svake minute

init();
